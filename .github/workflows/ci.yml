name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP Syntax Check (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Copy Config Template (for PHP compilation testing)
        run: cp utility/config.php utility/config.test.php || true

      - name: Check PHP Syntax
        run: |
          find . -type f -name "*.php" ! -path "*/vendor/*" -print0 | xargs -0 -n 1 php -l
